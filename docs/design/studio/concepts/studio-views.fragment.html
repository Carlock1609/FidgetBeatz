<div id="fb-studio-concept">
  <div class="viz-carousel viz-dotted-background" aria-label="FidgetBeatz Studio views">
    <section data-variant="Record view" aria-label="Record view"><div class="fb-stage"><div class="fb-phone" data-start="pads" aria-label="FidgetBeatz recording concept"></div></div></section>
    <section data-variant="Layers view" aria-label="Layers view" hidden><div class="fb-stage"><div class="fb-phone" data-start="layers" aria-label="FidgetBeatz layers concept"></div></div></section>
  </div>
</div>
<style>
#fb-studio-concept .fb-stage{min-height:820px;padding:20px 12px;display:flex;justify-content:center;align-items:flex-start}
#fb-studio-concept .fb-phone{--fb-bg:#080808;--fb-panel:#151515;--fb-edge:#343434;--fb-ink:#f4f4f4;--fb-dim:#b2b2b2;--fb-playhead:#ff5b63;--fb-pad:#7bc9f4;width:100%;max-width:400px;background:var(--fb-bg);color:var(--fb-ink);border:1px solid #414141;border-radius:26px;padding:22px 16px 14px;font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45;box-sizing:border-box;min-height:764px}
#fb-studio-concept .fb-phone *{box-sizing:border-box}
#fb-studio-concept .fb-top,#fb-studio-concept .fb-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
#fb-studio-concept .fb-top{margin-bottom:20px}
#fb-studio-concept .fb-brand{font-weight:650;letter-spacing:-.4px;font-size:18px}
#fb-studio-concept .fb-kicker{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--fb-dim)}
#fb-studio-concept button{font:inherit;cursor:inherit}
#fb-studio-concept .fb-action{min-height:44px;padding:8px 12px;border-radius:10px;background:var(--fb-panel);border:1px solid var(--fb-edge);color:var(--fb-ink);display:inline-flex;gap:6px;align-items:center;justify-content:center}
#fb-studio-concept .fb-action[aria-pressed=true]{background:var(--fb-ink);color:var(--fb-bg)}
#fb-studio-concept .fb-small{font-size:12px;color:var(--fb-dim)}
#fb-studio-concept .fb-time{font-family:ui-monospace,monospace;font-size:23px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
#fb-studio-concept .fb-time span{font-size:13px;color:var(--fb-dim);letter-spacing:0}
#fb-studio-concept .fb-transport{display:flex;align-items:center;gap:8px;margin:14px 0 18px}
#fb-studio-concept .fb-transport .fb-action{flex:1}
#fb-studio-concept .fb-rec-dot{width:9px;height:9px;border-radius:50%;background:var(--fb-playhead);display:inline-block}
#fb-studio-concept .fb-line{border:0;border-top:1px solid var(--fb-edge);margin:16px 0}
#fb-studio-concept .fb-strip{height:58px;background:var(--fb-panel);position:relative;margin:10px 0 4px;overflow:hidden;border-radius:6px}
#fb-studio-concept .fb-event{position:absolute;top:18px;width:4px;height:20px;background:var(--fb-ink);transform:translateX(-2px);border-radius:2px}
#fb-studio-concept .fb-head{position:absolute;top:0;bottom:0;width:2px;background:var(--fb-playhead);pointer-events:none;z-index:2}
#fb-studio-concept .fb-head::before{content:"";position:absolute;left:-3px;top:0;width:8px;height:6px;background:var(--fb-playhead)}
#fb-studio-concept .fb-ruler{display:flex;justify-content:space-between;color:var(--fb-dim);font-size:11px;font-family:ui-monospace,monospace}
#fb-studio-concept .fb-pad-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
#fb-studio-concept .fb-pad{height:84px;min-width:0;border:1px solid color-mix(in srgb,var(--pad-tint),transparent 55%);background:color-mix(in srgb,var(--pad-tint) 15%,#101010);color:var(--pad-tint);border-radius:12px;text-align:left;padding:9px;display:flex;align-items:flex-end;font-size:12px;position:relative;touch-action:manipulation}
#fb-studio-concept .fb-pad[data-lit]{background:var(--pad-tint);color:#080808}
#fb-studio-concept .fb-pad::before{content:"";position:absolute;top:10px;left:10px;width:5px;height:5px;background:var(--pad-tint);border-radius:50%}
#fb-studio-concept .fb-selected{font-weight:550}
#fb-studio-concept .fb-detail{margin-top:16px}
#fb-studio-concept .fb-tabs{display:flex;gap:6px;margin:16px 0}
#fb-studio-concept .fb-tabs .fb-action{flex:1}
#fb-studio-concept .fb-layers-ruler{display:grid;grid-template-columns:90px 1fr;gap:8px;margin-bottom:6px}
#fb-studio-concept .fb-layers-list{max-height:326px;overflow-y:auto;overscroll-behavior:contain}
#fb-studio-concept .fb-layer-row{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:stretch;border-top:1px solid #272727;min-height:54px}
#fb-studio-concept .fb-layer-name{color:var(--fb-dim);background:none;border:0;padding:8px 0;text-align:left;min-height:52px;display:flex;flex-direction:column;justify-content:center;font-size:12px}
#fb-studio-concept .fb-layer-name[aria-pressed=true]{color:var(--fb-ink)}
#fb-studio-concept .fb-layer-name span{font-size:11px;color:var(--fb-dim)}
#fb-studio-concept .fb-lane{position:relative;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),#242424 calc(25% - 1px),#242424 25%)}
#fb-studio-concept .fb-lane .fb-event{top:20px;height:13px;width:3px}
#fb-studio-concept .fb-layer-row[data-selected]{background:#1b1b1b}
#fb-studio-concept .fb-volume{width:100%;accent-color:#eee;min-height:32px}
#fb-studio-concept .fb-inspector{padding-top:14px;margin-top:10px;border-top:1px solid var(--fb-edge)}
#fb-studio-concept .fb-foot{margin-top:18px;display:flex;justify-content:space-between;color:var(--fb-dim);font-size:11px}
#fb-studio-concept .fb-focus .fb-hide-focus{display:none}
#fb-studio-concept .fb-focus .fb-pad{height:111px}
#fb-studio-concept .fb-note{color:var(--fb-dim);font-size:12px;margin:12px 0;min-height:18px}
#fb-studio-concept .fb-phone button:focus-visible{outline:2px solid white;outline-offset:3px}
@media(max-width:380px){#fb-studio-concept .fb-phone{padding:18px 10px}#fb-studio-concept .fb-stage{padding:12px 0;min-height:830px}#fb-studio-concept .fb-pad-grid{grid-template-columns:repeat(3,minmax(0,1fr))}#fb-studio-concept .fb-pad{height:72px;padding:7px;font-size:11px}#fb-studio-concept .fb-layer-row,#fb-studio-concept .fb-layers-ruler{grid-template-columns:80px 1fr}#fb-studio-concept .fb-action{padding:8px}}
</style>
<script>
(()=>{
const root=document.getElementById('fb-studio-concept');
const fmt=t=>'0:'+String(Math.floor(t)).padStart(2,'0');
const padNames=['Kick','Snare','Closed hat','Rim','Tom low','Tom high','Clap','Open hat','Shaker','Cowbell','Crash','Ride'];
const tones=['#e7a15f','#e693aa','#e8cf75','#a0c9b7','#b4a0db','#9ebbe1','#d8b0cd','#cec39c','#9ac4c5','#b8ca8b','#bfbdde','#d0d0d0'];
root.querySelectorAll('.fb-phone').forEach((phone)=>{
let view=phone.dataset.start,time=16,playing=false,recording=false,focus=false,selected=1;
const design={layerCount:8,playhead:'#ff5b63',radius:12};
const seed=[{name:'Drums',times:Array.from({length:48},(_,i)=>i*1.2)},{name:'Accent',times:[16]},{name:'Bass',times:[32,34,36,40,44,48]},{name:'Claps',times:[4,12,20,28,36,44,52]},{name:'Atmosphere',times:[0]},{name:'Percussion',times:[8,10,24,26,40,42]},{name:'Keys',times:[24,32,40]},{name:'Ending',times:[56]}];
const layers=Array.from({length:60},(_,i)=>seed[i]||{name:'Layer '+(i+1),times:[(i*7)%58]});

function markers(layer){return layer.times.map(t=>`<span class="fb-event" style="left:${100*t/60}%" aria-hidden="true"></span>`).join('')+`<span class="fb-head" style="left:${100*time/60}%" aria-hidden="true"></span>`;}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{studioView:view,selectedLayer:layers[selected].name,layerCount:design.layerCount},privateContent:null}).catch(()=>{});}
function draw(){const l=layers[selected];const muted=l.muted??false,volume=l.volume??80;phone.style.setProperty('--fb-playhead',design.playhead);phone.classList.toggle('fb-focus',focus);
phone.innerHTML=`<div class="fb-top"><div><div class="fb-brand">FidgetBeatz</div><div class="fb-kicker">${view==='pads'?'Studio · Record':'Studio · Layers'}</div></div><button class="fb-action" data-act="focus" aria-pressed="${focus}">${focus?'Exit focus':'Focus'}</button></div>
<div class="fb-row"><div class="fb-time" data-time>${fmt(time)} <span>/ 1:00</span></div><span class="fb-small">${recording?'● Recording · '+l.name:'Loop · 60 seconds'}</span></div>
<div class="fb-transport"><button class="fb-action" data-act="play" aria-pressed="${playing}"><i data-lucide="${playing?'pause':'play'}" aria-hidden="true"></i>${playing?'Pause':'Play'}</button><button class="fb-action" data-act="stop"><i data-lucide="square" aria-hidden="true"></i>Stop</button><button class="fb-action" data-act="record" aria-pressed="${recording}"><span class="fb-rec-dot"></span>${recording?'End take':'Record'}</button></div>

${view==='pads'||focus?`<div class="fb-row"><span class="fb-selected">${String(selected+1).padStart(2,'0')} · ${l.name}</span><span class="fb-small">${recording?'Armed':'Selected'} · ${l.times.length} ${l.times.length===1?'hit':'hits'}</span></div><div class="fb-strip" role="img" aria-label="${l.name}: ${l.times.length} hits across 60 seconds, playhead ${fmt(time)}">${markers(l)}</div><div class="fb-ruler"><span>0:00</span><span>0:15</span><span>0:30</span><span>0:45</span><span>1:00</span></div><div class="fb-note">${selected===1&&l.times.length===1?'One rim hit at 0:16. The rest stays silent.':'Tap a pad to preview its pressed state.'}</div><div class="fb-row fb-hide-focus"><span class="fb-small">CLASSIC DRUMS</span><span class="fb-small">12 pads</span></div><div class="fb-pad-grid">${padNames.map((n,i)=>`<button class="fb-pad" style="--pad-tint:${tones[i]};border-radius:${design.radius}px" data-pad="${i}" aria-label="${n}">${n}</button>`).join('')}</div><button class="fb-action fb-hide-focus" data-act="layers" style="width:100%">Expand layer timeline <i data-lucide="chevron-up" aria-hidden="true"></i></button>`:
`<div class="fb-layers-ruler"><span class="fb-small">${design.layerCount} layers</span><div class="fb-ruler"><span>0:00</span><span>0:30</span><span>1:00</span></div></div><div class="fb-layers-list">${layers.slice(0,design.layerCount).map((row,i)=>`<div class="fb-layer-row" ${i===selected?'data-selected':''}><button class="fb-layer-name" data-layer="${i}" aria-pressed="${selected===i}">${String(i+1).padStart(2,'0')} · ${row.name}<span>${row.times.length} ${row.times.length===1?'hit':'hits'}${row.times.length===1?' · '+fmt(row.times[0]):''}</span></button><div class="fb-lane" role="img" aria-label="${row.name}, ${row.times.length} hits">${markers(row)}</div></div>`).join('')}</div><div class="fb-inspector"><div class="fb-row"><strong>${l.name}</strong><button class="fb-action" data-act="mute" aria-pressed="${muted}">${muted?'Muted':'Mute'}</button></div><label class="fb-small">Volume · ${volume}%<input class="fb-volume" type="range" min="0" max="100" value="${volume}" aria-label="Selected layer volume"></label><div class="fb-note">${l.times.length===1?'1 hit · '+fmt(l.times[0]):l.times.length+' hits across this loop'}</div><button class="fb-action" style="width:100%" data-act="pads">Return to pads <i data-lucide="arrow-down" aria-hidden="true"></i></button></div>`}
<div class="fb-note" data-status aria-live="polite">${recording?'Preview only · pad taps add visual markers.':'Interactive concept · no audio is recorded.'}</div><div class="fb-foot fb-hide-focus"><span>Local draft</span><span>WAV download planned</span></div>`;
phone.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='pads'||a==='layers'){view=a;focus=false;}if(a==='focus'){focus=!focus;}if(a==='play')playing=!playing;if(a==='stop'){playing=false;recording=false;time=0;}if(a==='record'){recording=!recording;playing=recording;}if(a==='mute')l.muted=!muted;draw();save();});
phone.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{if(recording){phone.querySelector('[data-status]').textContent='End the take before changing the selected layer.';return;}selected=+b.dataset.layer;draw();save();});
phone.querySelectorAll('[data-pad]').forEach(b=>b.onpointerdown=()=>{b.setAttribute('data-lit','');setTimeout(()=>b.removeAttribute('data-lit'),240);if(recording){l.times.push(time);const strip=phone.querySelector('.fb-strip');if(strip)strip.innerHTML=markers(l);}const status=phone.querySelector('[data-status]');if(status)status.textContent=padNames[+b.dataset.pad]+' · '+fmt(time)+' · visual preview';});
const v=phone.querySelector('input');if(v)v.oninput=()=>{l.volume=+v.value;v.parentElement.firstChild.textContent='Volume · '+l.volume+'%';};
if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}
const saved=window.openai?.widgetState?.modelContent;if(saved?.layerCount)design.layerCount=Math.max(8,Math.min(60,saved.layerCount));
draw();
if(globalThis.Tweak){const t=new Tweak({container:phone,onChange:draw});t.addSlider(design,'layerCount',{label:'Layer count stress test',min:8,max:60,step:1});t.addColorPicker(design,'playhead',{label:'Functional playhead color'});t.addSlider(design,'radius',{label:'Pad corners',min:0,max:20,unit:'px'});}
let last=performance.now();function frame(now){const dt=(now-last)/1000;last=now;if(playing&&!phone.closest('[data-variant]').hidden){time+=dt;if(time>=60){time=0;recording=false;}const stamp=phone.querySelector('[data-time]');if(stamp)stamp.innerHTML=fmt(time)+' <span>/ 1:00</span>';phone.querySelectorAll('.fb-head').forEach(h=>h.style.left=(100*time/60)+'%');}requestAnimationFrame(frame);}requestAnimationFrame(frame);
});
})();
</script>
